<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f6feb" />
  <title>Workout Tracker</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js"
    }
  }
  </script>
</head>
<body>
  <main class="shell">
    <header class="app-header">
      <h1>Workout Tracker</h1>
    </header>

    <section class="model-screen">
      <p class="hint">Drag to rotate the body 360°. Tap a muscle to see its exercises.</p>
      <div id="model-container">
        <p id="model-loading" class="muted">Loading 3D model…</p>
      </div>
      <p class="credit muted">
        Model: “Free Pack – Male Base Mesh” by DuNguyn —
        <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC&nbsp;BY&nbsp;4.0</a>
      </p>
    </section>

    <!-- Exercise list panel (bottom sheet). Hidden until a muscle is tapped. -->
    <div class="backdrop" hidden></div>
    <aside class="panel" hidden aria-hidden="true" aria-labelledby="panel-title">
      <div class="panel-handle"></div>
      <header class="panel-header">
        <h2 id="panel-title">Exercises</h2>
        <button type="button" class="panel-close" aria-label="Close">×</button>
      </header>
      <div class="panel-body"></div>
    </aside>

    <footer class="app-footer">
      <span id="sw-status" class="muted">Service worker: checking…</span>
    </footer>
  </main>

  <script src="js/exercises.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/panel.js"></script>
  <script type="module" src="js/body3d.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
